name: Performance
description: Speed or memory - a slow path, an optimization, or a measurement that decides one.
labels: ["performance"]
body:
  - type: markdown
    attributes:
      value: |
        Read [Benchmarks](https://github.com/deftinfer/llm-mini-infer/blob/main/docs/benchmarks.md) and the measurement rules in [Development](https://github.com/deftinfer/llm-mini-infer/blob/main/docs/development.md#measurement-rules) first.

        Report a security problem through private vulnerability reporting, as [SECURITY.md](https://github.com/deftinfer/llm-mini-infer/blob/main/SECURITY.md) says. Never report it in an issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One to three sentences - what is slow or large, and for whom.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Today's number and how you measured it - the version or commit, the model, the GPU and its power limit, the load (requests in flight, prompt and output lengths) and the command.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change, or the method of the measurement.
  - type: textarea
    id: decision-rule
    attributes:
      label: Decision rule
      description: For a measurement, the result that decides go or close, written before the run.
  - type: textarea
    id: where
    attributes:
      label: Where
      description: The files, symbols or docs sections involved, if you know them. Give paths and names, not line numbers.
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: The table, test or change that shows the work is complete.
  - type: textarea
    id: related
    attributes:
      label: Related
      description: Other issues, pull requests or upstream links.
