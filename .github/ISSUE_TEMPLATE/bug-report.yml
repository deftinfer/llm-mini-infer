name: Bug report
description: Something is wrong - a wrong answer, a crash, a hang, or a promise in the docs that fails.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before you report, read [Operations](https://github.com/deftinfer/llm-mini-infer/blob/main/docs/operations.md) and [vLLM compatibility](https://github.com/deftinfer/llm-mini-infer/blob/main/docs/vllm-compatibility.md), and search the open issues.

        Report a security problem through private vulnerability reporting, as [SECURITY.md](https://github.com/deftinfer/llm-mini-infer/blob/main/SECURITY.md) says. Never report it in an issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One to three sentences - what is wrong, and for whom.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: The version or commit, the GPU (or CPU only), the settings that matter, the request or the test, and what you expected against what happened. Remove API keys and tokens.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where
      description: The files, symbols or docs sections involved, if you know them. Give paths and names, not line numbers.
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: A test that fails today and passes after the fix, if you can name one.
  - type: textarea
    id: related
    attributes:
      label: Related
      description: Other issues, pull requests or upstream links.
