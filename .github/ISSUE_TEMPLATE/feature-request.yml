name: Feature request
description: A new capability, setting or API field, or a change to the docs, the tests or CI.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Read [Architecture](https://github.com/deftinfer/llm-mini-infer/blob/main/docs/architecture.md) and [vLLM compatibility](https://github.com/deftinfer/llm-mini-infer/blob/main/docs/vllm-compatibility.md) first: they list what the server does and what it does not do yet. For a large change, agree on the approach in the issue before you write code.

        Report a security problem through private vulnerability reporting, as [SECURITY.md](https://github.com/deftinfer/llm-mini-infer/blob/main/SECURITY.md) says. Never report it in an issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One to three sentences - what is missing, and for whom.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you propose. For an API field, give vLLM's name for it and the behaviour you expect.
  - type: textarea
    id: where
    attributes:
      label: Where
      description: The files, symbols or docs sections involved, if you know them. Give paths and names, not line numbers.
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: The tests, docs or settings that show the change is complete.
  - type: textarea
    id: related
    attributes:
      label: Related
      description: Other issues, pull requests or upstream links.
